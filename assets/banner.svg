<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Vibrant Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(30, 41, 59, 0.7)" />
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0.85)" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 40px;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 17px;
      fill: #94a3b8;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #e2e8f0;
    }
    
    /* Dynamic pulsing animations */
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.35; transform: scale(1); }
      50% { opacity: 0.65; transform: scale(1.08); }
    }
    @keyframes floatPill1 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    @keyframes floatPill2 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(8px); }
    }
    @keyframes waveFlow {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: -200; }
    }
    @keyframes radarScan {
      0% { stroke-dashoffset: 400; }
      100% { stroke-dashoffset: 0; }
    }

    .ambient-sphere-1 {
      animation: pulseGlow 6s ease-in-out infinite;
      transform-origin: 200px 100px;
    }
    .ambient-sphere-2 {
      animation: pulseGlow 8s ease-in-out infinite alternate;
      transform-origin: 1000px 260px;
    }
    .pill-anim-1 {
      animation: floatPill1 5s ease-in-out infinite;
    }
    .pill-anim-2 {
      animation: floatPill2 6s ease-in-out infinite;
    }
    .flow-line {
      stroke-dasharray: 12 8;
      animation: waveFlow 10s linear infinite;
    }
  </style>

  <!-- Deep Canvas Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />

  <!-- Background Decorative Glowing Orbs -->
  <circle cx="180" cy="90" r="140" fill="#0284c7" opacity="0.25" filter="url(#softGlow)" class="ambient-sphere-1" />
  <circle cx="1020" cy="270" r="160" fill="#7c3aed" opacity="0.25" filter="url(#softGlow)" class="ambient-sphere-2" />
  <circle cx="600" cy="180" r="110" fill="#38bdf8" opacity="0.12" filter="url(#softGlow)" />

  <!-- Tech Grid Background Pattern -->
  <g opacity="0.07" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="150" y1="0" x2="150" y2="360" />
    <line x1="300" y1="0" x2="300" y2="360" />
    <line x1="450" y1="0" x2="450" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="750" y1="0" x2="750" y2="360" />
    <line x1="900" y1="0" x2="900" y2="360" />
    <line x1="1050" y1="0" x2="1050" y2="360" />
  </g>

  <!-- Flowing Dynamic Data Waves -->
  <path d="M-50,290 C300,340 450,210 750,260 C950,290 1100,210 1250,240" fill="none" stroke="url(#accentGrad)" stroke-width="2.5" opacity="0.4" class="flow-line" />
  <path d="M-50,110 C250,60 500,160 800,100 C1000,60 1120,130 1250,90" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.25" class="flow-line" />

  <!-- Outer Frame Border -->
  <rect x="1.5" y="1.5" width="1197" height="357" rx="15" fill="none" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5" />

  <!-- Left Side Visual Badge Container: Download Icon & Ring -->
  <g transform="translate(80, 110)">
    <circle cx="50" cy="50" r="48" fill="url(#cardGrad)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="2" />
    <circle cx="50" cy="50" r="40" fill="none" stroke="url(#accentGrad)" stroke-width="2.5" stroke-linecap="round" opacity="0.8" />
    <!-- Down Arrow Icon -->
    <path d="M50 32 L50 62 M36 48 L50 62 L64 48" fill="none" stroke="#38bdf8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Bottom Tray -->
    <path d="M34 68 L66 68" fill="none" stroke="#818cf8" stroke-width="3.5" stroke-linecap="round" />
  </g>

  <!-- Main Hero Headers (Safe from any overlapping elements) -->
  <g transform="translate(210, 105)">
    <!-- Category Pill -->
    <rect x="0" y="0" width="220" height="28" rx="14" fill="rgba(56, 189, 248, 0.15)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1" />
    <circle cx="14" cy="14" r="4" fill="#38bdf8" />
    <text x="28" y="19" class="badge-text" fill="#38bdf8">MEDIA DOWNLOADING ECOSYSTEM</text>

    <!-- Main Title -->
    <text x="0" y="65" class="title-text">Awesome Media Downloading</text>
    <text x="0" y="105" class="title-text" fill="url(#accentGrad)">&amp; Web Media Utilities</text>

    <!-- Subtitle -->
    <text x="0" y="142" class="subtitle-text">Curated Video Downloaders • Stream Fetchers • Accelerators • yt-dlp &amp; aria2 Ecosystems</text>
  </g>

  <!-- Floating Dynamic Tech Pills (Bottom Area, Positioned with Clear Separation) -->
  <g transform="translate(210, 290)">
    <!-- Pill 1: Engine -->
    <g class="pill-anim-1">
      <rect x="0" y="0" width="130" height="34" rx="17" fill="url(#cardGrad)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1" />
      <circle cx="16" cy="17" r="4" fill="#38bdf8" />
      <text x="28" y="22" class="badge-text">⚡ yt-dlp &amp; CLI</text>
    </g>

    <!-- Pill 2: Web & Cloud -->
    <g transform="translate(145, 0)" class="pill-anim-2">
      <rect x="0" y="0" width="165" height="34" rx="17" fill="url(#cardGrad)" stroke="rgba(129, 140, 248, 0.3)" stroke-width="1" />
      <circle cx="16" cy="17" r="4" fill="#818cf8" />
      <text x="28" y="22" class="badge-text">🌐 Web &amp; Self-Hosted</text>
    </g>

    <!-- Pill 3: Acceleration -->
    <g transform="translate(325, 0)" class="pill-anim-1">
      <rect x="0" y="0" width="165" height="34" rx="17" fill="url(#cardGrad)" stroke="rgba(192, 132, 252, 0.3)" stroke-width="1" />
      <circle cx="16" cy="17" r="4" fill="#c084fc" />
      <text x="28" y="22" class="badge-text">🚀 Multi-Thread / IDM</text>
    </g>

    <!-- Pill 4: Privacy & Ad-Free -->
    <g transform="translate(505, 0)" class="pill-anim-2">
      <rect x="0" y="0" width="155" height="34" rx="17" fill="url(#cardGrad)" stroke="rgba(52, 211, 153, 0.3)" stroke-width="1" />
      <circle cx="16" cy="17" r="4" fill="#34d399" />
      <text x="28" y="22" class="badge-text">🛡️ 100% Open Source</text>
    </g>
  </g>
</svg>
